# Offline Games development preview on the Aliyun Hangzhou node.
server {
    listen 127.0.0.1:8092;
    server_name _;
    root /srv/offline-games-dev/current;
    index index.html;

    location ~ "^/index\.[0-9a-f]{12}\." {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        location ~ \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
